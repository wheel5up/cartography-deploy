AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Cartography - Anthropic Lambda Loader. One Lambda calling
  start_anthropic_ingestion() unmodified, one Step Functions state machine
  (one execution = one invocation), one EventBridge schedule (daily 09:00
  UTC). Users, workspaces and API-key metadata fit in a single
  invocation, so there is no orchestrator or splits list. See README.md.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that Neo4j and the loaders run in.

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet with outbound internet (NAT), same VPC as Neo4j.

  LambdaMemoryMb:
    Type: Number
    Default: 512

  ScheduleDefault:
    Type: String
    Default: "cron(0 9 * * ? *)"
    Description: >
      Seed for /cartography/anthropic-lambda/schedule. Each loader has its
      own default slot so runs don't overlap; keep this before the ontology
      loader (10:00 UTC).

Resources:

  # ── Networking ─────────────────────────────────────────────────────────
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: cartography-anthropic-lambda-loader-sg
      GroupDescription: Cartography Anthropic Lambda loader - outbound only
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: cartography-anthropic-lambda-loader-sg }
        - { Key: Project, Value: cartography }

  LambdaEgressHttps:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: Outbound HTTPS (Anthropic API, SSM)

  LambdaEgressNeo4jBolt:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      DestinationSecurityGroupId: "{{resolve:ssm:/cartography/sg/neo4j}}"
      Description: Bolt 8443 to Neo4j

  Neo4jIngressFromAnthropicLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: "{{resolve:ssm:/cartography/sg/neo4j}}"
      IpProtocol: tcp
      FromPort: 8443
      ToPort: 8443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Bolt 8443 from Cartography Anthropic Lambda loader

  # ── Lambda ─────────────────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cartography-anthropic-lambda-loader-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: ReadNeo4jPassword
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cartography/neo4j/password"
        - PolicyName: ReadAnthropicAdminKey
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/cartography/anthropic/admin-key"
      Tags:
        - { Key: Project, Value: cartography }

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cartography/anthropic-lambda-loader
      RetentionInDays: 30

  AnthropicLoaderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: cartography-anthropic-lambda-loader
      Handler: handler.handler
      Runtime: python3.13
      Architectures: [x86_64]
      CodeUri: .
      MemorySize: !Ref LambdaMemoryMb
      Timeout: 900
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref SubnetId]
      LoggingConfig:
        LogGroup: !Ref LambdaLogGroup
      Environment:
        Variables:
          NEO4J_URI: "bolt://{{resolve:ssm:/cartography/neo4j/private-ip}}:8443"
          NEO4J_PASSWORD_SSM_PARAM: /cartography/neo4j/password
          NEO4J_MAX_CONNECTION_LIFETIME: "200"
          # Parameter NAME only, not the key. Read at invoke time, so the
          # stack deploys before it exists and a rotation takes effect on the
          # next run without a redeploy.
          ANTHROPIC_ADMIN_KEY_SSM_PARAM: /cartography/anthropic/admin-key
      Tags:
        Project: cartography

  # ── Step Functions: one execution = one invocation ─────────────────────
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cartography-anthropic-lambda-statemachine-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: states.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLoaderLambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AnthropicLoaderFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: "*"
      Tags:
        - { Key: Project, Value: cartography }

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cartography/scheduler/anthropic-lambda
      RetentionInDays: 30

  # Input: {} or {"update_tag": <int>}. A handler-reported FAILED becomes a
  # Fail state so the execution is red and the error is in the cause.
  AnthropicSyncStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: cartography-anthropic-lambda-sync
      RoleArn: !GetAtt StateMachineRole.Arn
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup: { LogGroupArn: !GetAtt StateMachineLogGroup.Arn }
      DefinitionSubstitutions:
        Fn: !GetAtt AnthropicLoaderFunction.Arn
      Definition:
        QueryLanguage: JSONata
        StartAt: Invoke
        States:
          Invoke:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Arguments:
              FunctionName: "${Fn}"
              Payload: "{% $states.input %}"
            Retry:
              - ErrorEquals: [Lambda.ServiceException, Lambda.AWSLambdaException, Lambda.SdkClientException, Lambda.TooManyRequestsException]
                IntervalSeconds: 2
                MaxAttempts: 2
                BackoffRate: 2
            Output: "{% $states.result.Payload %}"
            Next: Succeeded?
          Succeeded?:
            Type: Choice
            Choices:
              - Condition: "{% $states.input.status = 'SUCCEEDED' %}"
                Next: Done
            Default: SyncFailed
          Done:
            Type: Succeed
          SyncFailed:
            Type: Fail
            Error: AnthropicSyncFailed
            Cause: "{% $string($states.input) %}"

  # ── Schedule ───────────────────────────────────────────────────────────
  ScheduleParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cartography/anthropic-lambda/schedule
      Type: String
      Value: !Ref ScheduleDefault
      Tags: { Project: cartography }

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cartography-anthropic-lambda-scheduler-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref AnthropicSyncStateMachine
      Tags:
        - { Key: Project, Value: cartography }

  # Change State here, not via the CLI (a CLI flip is reverted by sam deploy).
  AnthropicLambdaSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: cartography-anthropic-lambda-daily
      State: ENABLED
      ScheduleExpression: !Sub "{{resolve:ssm:${ScheduleParameter}}}"
      ScheduleExpressionTimezone: UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !Ref AnthropicSyncStateMachine
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: "{}"

Outputs:
  SyncStateMachineArn:
    Value: !Ref AnthropicSyncStateMachine
  FunctionArn:
    Value: !GetAtt AnthropicLoaderFunction.Arn
  LambdaLogGroup:
    Value: !Ref LambdaLogGroup
