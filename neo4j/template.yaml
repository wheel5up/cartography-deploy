AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Cartography - Neo4j
  Runs Neo4j 5 Community and cloudflared as ECS services on one EC2 instance
  in a private subnet. Writes instance ID and private IP to SSM for other
  stacks.

# ============================================================================
# READ BEFORE DEPLOYING
#
# Neo4j and cloudflared settings live in the ECS task definitions below.
# Changing a setting or image tag is a normal `sam deploy`: ECS stops the old
# container and starts a new one on the same instance. The graph lives on the
# instance's root volume (/neo4j-data), so it survives container restarts.
#
# Changing AmiId or RootVolumeSize REPLACES the instance, and the new one
# starts with an empty graph. The old instance is retained (not terminated)
# and must be terminated by hand. Always preview first:
# `sam deploy --no-execute-changeset` and refuse any change set that shows
# Replacement on Neo4jInstance unless you mean it.
# ============================================================================

Parameters:
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet with outbound internet (NAT), same VPC as Neo4j.

  InstanceType:
    Type: String
    Default: t3.xlarge
    AllowedValues: [t3.medium, t3.large, t3.xlarge]

  AmiId:
    Type: AWS::EC2::Image::Id
    Description: >
      ECS-optimized Amazon Linux 2023 x86_64 AMI ID in the deploy region. Look
      it up with `aws ssm get-parameter --name
      /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id`.
      Pinned rather than resolved at deploy time because a new AMI ID
      replaces the instance.

  RootVolumeSize:
    Type: Number
    Default: 100
    Description: >
      GB. Sized for a store of ~16 GB + tx logs capped at 20 GB + OS/Docker,
      with headroom: a full disk stops Neo4j.

  Neo4jImageTag:
    Type: String
    Default: 5.26.27-community
    Description: >
      Pinned neo4j Docker image tag (not the floating "5-community" tag).
      APOC Core is loaded from the same image, so it always matches.

  CloudflaredImageTag:
    Type: String
    Default: 2026.10.2
    Description: >
      Pinned cloudflare/cloudflared image tag. Check https://hub.docker.com/r/cloudflare/cloudflared/tags
      before bumping.

  TunnelTokenParameter:
    Type: String
    Default: /cartography/cloudflare/tunnel-token
    Description: >
      SSM SecureString holding the Cloudflare Tunnel token. Must exist before
      deploying: ECS can't start cloudflared without it.

  Neo4jPasswordParameter:
    Type: String
    Default: /cartography/neo4j/password
    Description: >
      SSM SecureString holding the password for the built-in `neo4j` user
      (at least 8 characters). Must exist before deploying. Applied only
      when the graph is empty; see README.md "Auth". Every loader reads it.

  BoltAdvertisedAddress:
    Type: String
    Description: >
      Value for server.bolt.advertised_address: the host:port the Neo4j
      browser is told to use for Bolt, e.g. the Cloudflare Tunnel hostname.
      Loaders connect to bolt://<private-ip>:8443 and don't use it.

Resources:

  # ------------------------------------------------------------------
  # EC2 instance (ECS container instance)
  # ------------------------------------------------------------------
  Neo4jInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cartography-neo4j-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
      Tags:
        - Key: Project
          Value: cartography

  Neo4jInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "cartography-neo4j-profile-${AWS::Region}"
      Roles:
        - !Ref Neo4jInstanceRole

  Neo4jInstance:
    Type: AWS::EC2::Instance
    # If an update ever replaces the instance, keep the old one (and its root
    # volume, i.e. the graph) instead of terminating it.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref Neo4jInstanceProfile
      SecurityGroupIds:
        - "{{resolve:ssm:/cartography/sg/neo4j}}"
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      # Only joins the ECS cluster and creates the data directories. All
      # Neo4j and cloudflared configuration is in the task definitions.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/user-data.log 2>&1
          echo "ECS_CLUSTER=${Neo4jCluster}" >> /etc/ecs/ecs.config
          mkdir -p /neo4j-data/data /neo4j-data/logs
          chown -R 7474:7474 /neo4j-data
          echo "UserData complete"
      Tags:
        - Key: Name
          Value: cartography-neo4j
        - Key: Project
          Value: cartography

  # ------------------------------------------------------------------
  # ECS
  # ------------------------------------------------------------------
  Neo4jCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: cartography-neo4j
      Tags:
        - Key: Project
          Value: cartography

  Neo4jLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /cartography/neo4j
      RetentionInDays: 30

  # Pulls images, writes logs, and reads the two SSM secrets into the
  # containers' environment.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "cartography-neo4j-task-exec-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Neo4jPasswordParameter}"
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TunnelTokenParameter}"
      Tags:
        - Key: Project
          Value: cartography

  # Host networking: Neo4j listens on the instance's own IP, so the security
  # group and the loaders' bolt://<private-ip>:8443 work unchanged, and
  # cloudflared reaches Neo4j on localhost.
  Neo4jTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cartography-neo4j
      NetworkMode: host
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      Volumes:
        - Name: data
          Host:
            SourcePath: /neo4j-data/data
        - Name: logs
          Host:
            SourcePath: /neo4j-data/logs
      ContainerDefinitions:
        - Name: neo4j
          Image: !Sub "neo4j:${Neo4jImageTag}"
          Essential: true
          # Heap 5g + page cache 6400m + JVM/native overhead. Soft limit, so
          # Neo4j isn't killed for going over it.
          MemoryReservation: 12288
          StopTimeout: 120
          Ulimits:
            - Name: nofile
              SoftLimit: 40000
              HardLimit: 40000
          PortMappings:
            - ContainerPort: 7474
              HostPort: 7474
              Protocol: tcp
            - ContainerPort: 8443
              HostPort: 8443
              Protocol: tcp
          MountPoints:
            - SourceVolume: data
              ContainerPath: /data
            - SourceVolume: logs
              ContainerPath: /logs
          # NEO4J_AUTH must be "neo4j/<password>", but the SSM parameter holds
          # only the password (the loaders read it too). Build NEO4J_AUTH here,
          # then run the image's normal entrypoint. DB_PASSWORD deliberately
          # lacks the NEO4J_ prefix: the entrypoint turns every NEO4J_*
          # variable into a neo4j.conf setting.
          EntryPoint: ["tini", "-g", "--", "bash", "-c"]
          Command:
            - 'export NEO4J_AUTH="neo4j/$DB_PASSWORD"; unset DB_PASSWORD; exec /startup/docker-entrypoint.sh neo4j'
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Neo4jPasswordParameter}"
          # NEO4J_<setting>: "." -> "_", "_" -> "__".
          Environment:
            # APOC Core, copied from the image's labs/ directory (no download).
            - Name: NEO4J_PLUGINS
              Value: '["apoc"]'
            # apoc.meta.* (schema introspection) only, not all of apoc.*.
            - Name: NEO4J_dbms_security_procedures_unrestricted
              Value: apoc.meta.*
            - Name: NEO4J_server_default__listen__address
              Value: 0.0.0.0
            - Name: NEO4J_server_bolt_enabled
              Value: "true"
            - Name: NEO4J_server_bolt_listen__address
              Value: 0.0.0.0:8443
            - Name: NEO4J_server_bolt_advertised__address
              Value: !Ref BoltAdvertisedAddress
            # Plain Bolt inside the VPC; loaders use bolt://, not bolt+s://.
            - Name: NEO4J_server_bolt_tls__level
              Value: DISABLED
            - Name: NEO4J_server_http_enabled
              Value: "true"
            - Name: NEO4J_server_http_listen__address
              Value: 0.0.0.0:7474
            - Name: NEO4J_server_https_enabled
              Value: "false"
            # neo4j-admin server memory-recommendation --memory=15g --docker
            # (t3.xlarge, 16 GiB). Re-run it if you change InstanceType.
            - Name: NEO4J_server_memory_heap_initial__size
              Value: 5g
            - Name: NEO4J_server_memory_heap_max__size
              Value: 5g
            - Name: NEO4J_server_memory_pagecache_size
              Value: 6400m
            - Name: NEO4J_server_jvm_additional
              Value: -XX:+ExitOnOutOfMemoryError
            # Size cap, not the 2-day default: a time-based policy lets a
            # heavy night of writes (e.g. a large Inspector sync) fill the disk.
            - Name: NEO4J_db_tx__log_rotation_retention__policy
              Value: 20G size
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: neo4j
      Tags:
        - Key: Project
          Value: cartography

  # Separate task and service, so a cloudflared upgrade doesn't restart Neo4j.
  CloudflaredTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: cartography-cloudflared
      NetworkMode: host
      RequiresCompatibilities: [EC2]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: cloudflared
          Image: !Sub "cloudflare/cloudflared:${CloudflaredImageTag}"
          Essential: true
          MemoryReservation: 256
          # Image entrypoint is `cloudflared --no-autoupdate`. `tunnel run`
          # reads the token from TUNNEL_TOKEN.
          Command: ["tunnel", "run"]
          Secrets:
            - Name: TUNNEL_TOKEN
              ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TunnelTokenParameter}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Neo4jLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: cloudflared
      Tags:
        - Key: Project
          Value: cartography

  # One task on one instance with fixed host ports, so a deployment stops the
  # old task before starting the new one (MinimumHealthyPercent 0). The
  # placement constraint pins tasks to the current instance, so a retained
  # old instance can't receive them.
  Neo4jService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: neo4j
      Cluster: !Ref Neo4jCluster
      LaunchType: EC2
      TaskDefinition: !Ref Neo4jTaskDefinition
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "ec2InstanceId == ${Neo4jInstance}"
      Tags:
        - Key: Project
          Value: cartography

  CloudflaredService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: cloudflared
      Cluster: !Ref Neo4jCluster
      LaunchType: EC2
      TaskDefinition: !Ref CloudflaredTaskDefinition
      DesiredCount: 1
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      PlacementConstraints:
        - Type: memberOf
          Expression: !Sub "ec2InstanceId == ${Neo4jInstance}"
      Tags:
        - Key: Project
          Value: cartography

  # ------------------------------------------------------------------
  # Write instance info to SSM - other stacks read as plain parameters
  # ------------------------------------------------------------------
  SsmNeo4jInstanceId:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cartography/neo4j/instance-id
      Type: String
      Value: !Ref Neo4jInstance

  SsmNeo4jPrivateIp:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /cartography/neo4j/private-ip
      Type: String
      Value: !GetAtt Neo4jInstance.PrivateIp

Outputs:
  Neo4jInstanceId:
    Value: !Ref Neo4jInstance
  Neo4jPrivateIp:
    Value: !GetAtt Neo4jInstance.PrivateIp
  ClusterName:
    Value: !Ref Neo4jCluster
