# Copy to samconfig.toml (gitignored) and fill in your values.
version = 0.1

[default.deploy.parameters]
stack_name   = "cartography-network"
region       = "us-east-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3   = true

parameter_overrides = [
  "VpcId=vpc-0123456789abcdef0",
  "ClientCidr=10.0.0.0/16"
]
